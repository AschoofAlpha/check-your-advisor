# Publishes a release when a version tag is pushed:
#
#     git tag v0.4.0 && git push origin v0.4.0
#
# The tag has to match the version in pyproject.toml, and the full suite has to
# pass, before anything is published. Two independent jobs follow:
#
# - pypi uploads to PyPI through Trusted Publishing, so no token is stored
#   anywhere. It needs a one-time setup on PyPI: the project's Settings ->
#   Publishing -> add a GitHub publisher with owner AschoofAlpha, repository
#   check-your-advisor, workflow release.yml and environment pypi. Until then
#   this job fails and can be re-run from the Actions page once it is set up.
# - github-release creates the GitHub Release, with that version's section of
#   CHANGELOG.md as its notes and the built files attached.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: tag matches the version, suite passes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: The tag names pyproject's version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - run: python tests/run_all.py
      - run: python tests/run_all.py --block-third-party

  pypi:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Release notes from CHANGELOG.md
        run: |
          python - "${GITHUB_REF_NAME#v}" > notes.md <<'PY'
          import re, sys
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(r"^## " + re.escape(sys.argv[1]) + r"\b[^\n]*\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(match.group(1).strip() if match else "")
          PY
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
